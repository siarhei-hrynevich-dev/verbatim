name: Bug report
description: Something in Verbatim does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.
        Security problems must not be reported here: follow the [Security Policy](https://github.com/siarhei-hrynevich/verbatim/security/policy) instead.
        Do not attach real recordings, transcripts, or anything else containing personal data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Choose …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Verbatim version
      description: From Settings › About, or the commit if you built it yourself.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.5, MacBook Pro M3
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording
        - Library
        - Viewer / playback
        - Transcription
        - Summaries
        - Search index
        - MCP server for AI agents
        - Settings / model downloads
        - Building from source
        - Other
    validations:
      required: true
  - type: input
    id: models
    attributes:
      label: Models in use
      description: The speech, summary or embedding model selected in Settings, if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Console output or screenshots, with personal data removed.
      render: text
